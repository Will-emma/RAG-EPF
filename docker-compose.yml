version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: epf_rag_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: epf_rag_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db

  backend:
    build: ./backend
    container_name: epf_rag_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Le frontend Angular tourne en local avec `ng serve` pendant le dev
  # (voir frontend/README.md). Décommentez ce service une fois l'app
  # buildée si vous voulez la conteneuriser pour la démo / le déploiement.
  # frontend:
  #   build: ./frontend
  #   container_name: epf_rag_frontend
  #   ports:
  #     - "4200:80"
  #   depends_on:
  #     - backend

volumes:
  pgdata:
  backend_uploads:
