<header class="navbar">
  <a class="navbar-brand" routerLink="/">
    <img
      src="/epf-logo.png"
      alt="EPF Engineering School"
      class="epf-logo"
    />

    <span class="brand-text">
      <span class="brand-epf">EPF</span>
      <span class="brand-study">Study AI</span>
    </span>
  </a>

  @if (auth.isAuthenticated) {
    <div class="navbar-user">
      @if (auth.userEmail; as email) {
        <a class="user-email" routerLink="/profile">{{ email }}</a>
      }
      <button type="button" class="logout-button" (click)="auth.logout()">Déconnexion</button>
    </div>
  }
</header>
