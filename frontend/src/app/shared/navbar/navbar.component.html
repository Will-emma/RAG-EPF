<header class="navbar">

  <!-- Logo -->
  <a class="navbar-brand" routerLink="/">

    <img
      src="/epf-logo.png"
      alt="EPF Engineering School"
      class="epf-logo"
    />

    <span class="brand-text">
      <span class="brand-epf">EPF</span>
      <span class="brand-study">Study AI</span>
    </span>

  </a>


  <!-- 已登录 -->
  @if (isLoggedIn) {

    <button
      type="button"
      class="navbar-profile"
      (click)="goToProfile()"
    >

      <div class="profile-icon">
        WE
      </div>

      <span>Mon profil</span>

    </button>

  } @else {

    <!-- 未登录 -->
    <button
      type="button"
      class="login-button"
      (click)="goToLogin()"
    >
      Connexion
    </button>

  }

</header>
